title: Potential Credential Dumping Via LSASS Process Access
id: bcc79b72-5fa7-4bce-98cd-f9156823c45e
status: experimental
description: |
  Detects a process opening lsass.exe to read its memory, through minidump functions in
  dbghelp, dbgcore or comsvcs or with full access and Mimikatz access masks.
references:
  - https://attack.mitre.org/techniques/T1003/001/
  - https://learn.microsoft.com/en-us/windows/win32/procthread/process-security-and-access-rights
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1003.001/T1003.001.md
author: Dubwaay
date: 2026-10-19
tags:
  - attack.credential-access
  - attack.t1003.001
logsource:
  category: process_access
  product: windows
detection:
  selection_target:
    TargetImage|endswith: '\lsass.exe'
  selection_method_dll:
    CallTrace|contains:
      # minidump functions: MiniDumpWriteDump in dbgcore/dbghelp, MiniDump export in comsvcs
      - '\dbgcore.dll'
      - '\dbghelp.dll'
      - '\comsvcs.dll'
  selection_method_access:
    GrantedAccess:
      # full access
      - '0x1fffff'
      - '0x1f3fff'
      - '0x1f1fff'
      # masks used by Mimikatz to read LSASS memory
      - '0x1010'
      - '0x1438'
      - '0x143a'
  filter_main_system:
    SourceImage:
      - 'C:\Windows\System32\wininit.exe'
      - 'C:\Windows\System32\csrss.exe'
  filter_main_msiexec:
    SourceImage: 'C:\Windows\System32\msiexec.exe'
    CallTrace|contains: 'C:\Windows\System32\perfproc.dll'
  filter_main_sysmon:
    SourceImage: 'C:\Windows\Sysmon64.exe'
    CallTrace|contains: 'C:\Windows\Sysmon64.exe'
  filter_optional_zoom:
    SourceImage: 'C:\Windows\System32\msiexec.exe'
    CallTrace|contains:
      - 'C:\Program Files\Zoom\Zoom\CustomAction.dll'
      - 'C:\Program Files\Zoom\Zoom(64bit)\CustomAction.dll'
  condition: selection_target and 1 of selection_method_* and not 1 of filter_main_* and not 1 of filter_optional_*
fields:
  - UtcTime
  - Computer
  - SourceImage
  - SourceProcessId
  - SourceProcessGUID
  - TargetImage
  - GrantedAccess
  - CallTrace
falsepositives:
  - Antivirus, EDR and backup agents opening lsass with full access (exclude by full path)
  - Administrators creating an lsass dump with Task Manager or ProcDump for troubleshooting
  - Process Explorer run as administrator opening lsass with full access about every 1.3 seconds
  - Installer custom actions that open lsass with full access, like the excluded Zoom installer
level: high
