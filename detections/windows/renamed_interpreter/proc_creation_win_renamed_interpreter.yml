title: Command Or Script Interpreter Running Under Another Name
id: c51e388f-6abf-4f1e-ab0b-c3dd6166b76c
status: experimental
description: |
  Detects cmd.exe, PowerShell, pwsh, wscript, cscript or mshta started from a file with another
  name. OriginalFileName shows the real program.
references:
  - https://attack.mitre.org/techniques/T1036/003/
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1036.003/T1036.003.md
  - https://redcanary.com/threat-detection-report/techniques/rename-system-utilities/
author: Dubwaay
date: 2026-10-24
tags:
  - attack.stealth
  - attack.t1036.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    OriginalFileName|startswith:
      - 'Cmd.Exe'
      - 'PowerShell.EXE'
      - 'pwsh.dll'
      - 'wscript.exe'
      - 'cscript.exe'
      - 'MSHTA.EXE'
  filter_main_interpreter_name:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\mshta.exe'
  condition: selection and not 1 of filter_main_*
fields:
  - UtcTime
  - Computer
  - User
  - ParentImage
  - ParentCommandLine
  - Image
  - OriginalFileName
  - CommandLine
falsepositives:
  - Portable or vendor tools that bundle a renamed copy of cmd.exe or PowerShell
level: high
