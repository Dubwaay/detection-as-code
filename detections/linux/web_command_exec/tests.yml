        sha256: 9b340b09d6c28e09e0e3cdd4be60acbe6fa13388976bb82a5d3c4e8b03eaf02e
        size: 18033190
        sourcetype: linux_audit
        source: /var/log/audit/audit.log
    expect:
      min_results: 7852
      max_results: 7852
      match: {exe: '*/python3.9', tty: '(none)'}
  - name: tp_zoneminder_exploit_racecondition
    description: CAM-LDS scenario 1, video server, variant racecondition + localaccount. The same exploit and Python loader, then the logrotate race condition.
    datasets:
      - url: https://zenodo.org/records/18861762/files/scenario_1_racecondition_localaccount.zip?download=1
        member: scenario_1_racecondition_localaccount/videoserver/logs/log/audit/audit.log
        sha256: fba1eee58104e1c93f592c85ddcbd85a64990556fc12df931eb339a6d3cea71a
        size: 19569534
