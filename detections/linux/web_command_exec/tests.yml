rule_id: ec6771bc-8f66-4d1b-86c2-30ebee13da9c
cases:
  - name: tp_zoneminder_exploit_sudo
    description: CAM-LDS scenario 1, video server, variant sudo + localaccount. The ZoneMinder exploit starts a Python loader as www-data, then the attacker works as www-data from a terminal.
    datasets:
      - url: https://zenodo.org/records/18861762/files/scenario_1_sudo_localaccount.zip?download=1
        member: scenario_1_sudo_localaccount/videoserver/logs/log/audit/audit.log
        sha256: 40eefe42f94b7cfbd69a1b65c9d7eb31809b8b810a6d8f9a25887cb30002b8f5
        size: 20343000
        sourcetype: linux_audit
        source: /var/log/audit/audit.log
    expect:
      min_results: 7831
      max_results: 7831
      match: {exe: '*/python3.9', tty: '(none)'}
  - name: tp_zoneminder_exploit_pwnkit
    description: CAM-LDS scenario 1, video server, variant pwnkit + localaccount. The same exploit and Python loader, then PwnKit.
