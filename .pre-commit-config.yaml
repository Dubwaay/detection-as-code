# update versions: pre-commit autoupdate
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: local
    hooks:
      - id: sigma-check
        name: sigma check
        # every rule file; tests.yml holds test cases, not a rule
        entry: bash -c 'uv run --locked sigma check -i $(find detections -name "*.yml" ! -name tests.yml)'
        language: system
        pass_filenames: false
        files: ^detections/
      - id: pytest
        name: pytest
        entry: uv run --locked pytest -q
        language: system
        pass_filenames: false
        files: ^(detections/|tools/|tests/|pyproject\.toml$|uv\.lock$)
