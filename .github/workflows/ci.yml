name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.1"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/datasets
          key: datasets-${{ hashFiles('detections/**/tests.yml') }}
          restore-keys: datasets-

      - run: uv sync --locked

      - name: lint
        # gitleaks only scans staged changes; sigma check and pytest run as their own steps
        run: uvx pre-commit@4.7.0 run --all-files --show-diff-on-failure
        env:
          SKIP: gitleaks,sigma-check,pytest

      - name: sigma check
        run: uv run sigma check -i $(find detections -name '*.yml' ! -name tests.yml)

      - name: detection tests
        run: uv run pytest -v

  goodlog:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        baseline: [win10-client]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: goodlog ${{ matrix.baseline }}
        run: tools/goodlog.sh ${{ matrix.baseline }}
